services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - redis_prod_data:/data
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api.prod
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      API_PORT: 3001
      WEB_URL: ${WEB_URL:?WEB_URL is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_URL: redis://redis:6379
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:?WHATSAPP_GRAPH_API_VERSION is required}
      WHATSAPP_WEBHOOK_PUBLIC_URL: ${WHATSAPP_WEBHOOK_PUBLIC_URL:?WHATSAPP_WEBHOOK_PUBLIC_URL is required}
      WHATSAPP_WEB_BRIDGE_ENABLED: ${WHATSAPP_WEB_BRIDGE_ENABLED:-false}
      WHATSAPP_BRIDGE_INTERNAL_SECRET: ${WHATSAPP_BRIDGE_INTERNAL_SECRET:-}
      WHATSAPP_BRIDGE_CHANNEL_KEY: ${WHATSAPP_BRIDGE_CHANNEL_KEY:-}
      WHATSAPP_BRIDGE_API_URL: http://whatsapp-bridge:3020
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - internal

  whatsapp-reader:
    build:
      context: .
      dockerfile: docker/Dockerfile.whatsapp-reader.prod
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      READER_API_URL: http://api:3001/api/v1
      WHATSAPP_READER_AUTH_DIR: /data/auth
      READER_PORT: 3010
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - whatsapp_reader_auth:/data/auth
    networks:
      - internal

  whatsapp-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.whatsapp-bridge.prod
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      WHATSAPP_WEB_BRIDGE_ENABLED: ${WHATSAPP_WEB_BRIDGE_ENABLED:-false}
      WHATSAPP_BRIDGE_API_URL: http://api:3001/api/v1
      WHATSAPP_BRIDGE_INTERNAL_SECRET: ${WHATSAPP_BRIDGE_INTERNAL_SECRET:-}
      WHATSAPP_BRIDGE_CHANNEL_KEY: ${WHATSAPP_BRIDGE_CHANNEL_KEY:-}
      WHATSAPP_WEB_SESSION_ENCRYPTION_KEY: ${WHATSAPP_WEB_SESSION_ENCRYPTION_KEY:-}
      WHATSAPP_WEB_SESSION_DIR: /data/session
      WHATSAPP_BRIDGE_PORT: 3020
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - whatsapp_bridge_session:/data/session
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  postgres_prod_data:
  redis_prod_data:
  whatsapp_reader_auth:
  whatsapp_bridge_session:

networks:
  internal:
    driver: bridge
