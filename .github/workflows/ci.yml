name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://superflash:superflash@localhost:5432/superflash?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: superflash
          POSTGRES_PASSWORD: superflash
          POSTGRES_USER: superflash
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Run seed twice
        run: npm run db:seed && npm run db:seed

      - name: Verify database integrity
        run: npm run db:verify-integrity

      - name: Prettier
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Apply isolated domain migrations
        env:
          DATABASE_URL: postgresql://superflash:superflash@localhost:5432/superflash?schema=auth_test
        run: npm run db:migrate:deploy

      - name: Auth, contacts, opportunities, follow-ups, agenda, my-day and catalog integration tests
        env:
          DATABASE_URL: postgresql://superflash:superflash@localhost:5432/superflash?schema=auth_test
          NODE_ENV: test
          COOKIE_SECURE: 'false'
          SWAGGER_ENABLED: 'false'
          DEFAULT_TIMEZONE: America/Santiago
          JWT_ACCESS_SECRET: ci-only-auth-test-secret-change-me-1234567890
        run: npm run test:integration

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build:web

      - name: Build backend
        run: npm run build:api
