services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: superflash
      POSTGRES_PASSWORD: superflash
      POSTGRES_USER: superflash
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U superflash -d superflash']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - '1025:1025'
      - '8025:8025'

  adminer:
    image: adminer:4.8.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '8080:8080'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      API_PORT: 3001
      DATABASE_URL: postgresql://superflash:superflash@postgres:5432/superflash?schema=public
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    command: ['npm', 'run', 'dev:api']

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    command: ['npm', 'run', 'dev:web']

volumes:
  postgres_data:
  redis_data:
